name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Verify iOS
        run: |
          swift test
          pod lib lint LiveUpdateProvider.podspec

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Run Android tests
        working-directory: ./android
        run: ./gradlew :live-update-provider:test

      - name: Generate Dokka
        working-directory: ./android
        run: ./gradlew :live-update-provider:dokkaGenerate

      - name: Validate Android publication
        working-directory: ./android
        run: ./gradlew :live-update-provider:assembleRelease
